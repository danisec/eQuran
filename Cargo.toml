[package]
name = "equran-cli"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/equran-core", "crates/equran-desktop"]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
equran-core = { path = "crates/equran-core" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = []
audio = ["equran-core/audio"]
