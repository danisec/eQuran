[package]
name = "equran-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[features]
default = []
audio = []
