[package]
name = "equran-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "equran_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "equran-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "5"
equran-core = { path = "../equran-core", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }
